# Set Prefix
unbind C-b
set -g prefix C-f
bind C-f send-prefix

# Pass Neovim's colours through untouched. tmux renders 24-bit SGR down to the
# palette it credits the outer terminal with, and over SSH that terminal is
# xterm-256color, whose terminfo declares neither RGB nor styled underlines — so
# a truecolour colourscheme gets rounded to 256 colours and diagnostic
# undercurls are dropped. RGB restores the colours, usstyle the undercurls.
set -as terminal-features "*:RGB:usstyle"

# ...but tmux re-emits the underline colour in its own five-parameter colon
# form, ESC[58:2:R:G:Bm, and Windows Terminal ignores that one -- it draws the
# curl in the text's own foreground colour, which looks like a colourless
# squiggle beside a coloured diagnostic sign. Override Setulc to the
# six-parameter form Neovim itself sends, ESC[58:2::R:G:Bm (the empty field is
# the colour-space id ITU T.416 asks for), which Windows Terminal does honour.
# Measured on the wire, both the bytes leaving tmux and A-vs-C in the terminal.
# Each "::" is how a literal colon is escaped inside a terminal-overrides value.
set -as terminal-overrides ",*:Setulc=\\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# Use vim bindings in scroll mode.
setw -g mode-keys vi

# Rebind window split
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Rebind pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Rebind pane resizing
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# Rebind window navigation
unbind n
unbind p
bind C-h previous-window
bind C-l next-window
bind Tab last-window

