# Set Prefix
unbind C-b
set -g prefix C-f
bind C-f send-prefix

# NOTE: without this tmux downsamples Neovim's truecolour and drops undercurls.
set -as terminal-features "*:RGB:usstyle"

# HACK: tmux's usstyle emits a five-parameter underline colour that Windows
# Terminal ignores; this restores the six-parameter form. "::" is one colon.
set -as terminal-overrides ",*:Setulc=\\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# NOTE: not the default -- 'external' ignores a program's own OSC 52.
set -s set-clipboard on

# Forwarded into the pane; nothing consumes it yet.
set -g focus-events on

# The default is 2000 lines per pane, which a build log outruns.
set -g history-limit 50000

# NOTE: not a default -- derived from $EDITOR/$VISUAL, unset here.
setw -g mode-keys vi

# -c: open where the current pane already is.
bind c new-window -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Rebind pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Rebind pane resizing
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# Rebind window navigation
unbind n
unbind p
bind C-h previous-window
bind C-l next-window
bind Tab last-window

# Pane colours from tokyonight-night's terminal palette (folke/tokyonight.nvim,
# extras/kitty/tokyonight_night.conf). tmux substitutes these for the 16 ANSI
# colours a program asks for, so the shell matches Neovim whatever theme the
# outer terminal has. Needs tmux 3.3 and the RGB feature above.
set -g window-style "fg=#c0caf5,bg=#1a1b26"
set -g cursor-colour "#c0caf5"
set -g pane-colours[0] "#15161e"
set -g pane-colours[1] "#f7768e"
set -g pane-colours[2] "#9ece6a"
set -g pane-colours[3] "#e0af68"
set -g pane-colours[4] "#7aa2f7"
set -g pane-colours[5] "#bb9af7"
set -g pane-colours[6] "#7dcfff"
set -g pane-colours[7] "#a9b1d6"
set -g pane-colours[8] "#414868"
set -g pane-colours[9] "#ff899d"
set -g pane-colours[10] "#9fe044"
set -g pane-colours[11] "#faba4a"
set -g pane-colours[12] "#8db0ff"
set -g pane-colours[13] "#c7a9ff"
set -g pane-colours[14] "#a4daff"
set -g pane-colours[15] "#c0caf5"

# Powerline blocks in tokyonight-night's palette. Separators are U+E0B0
# "" and U+E0B2 "", so the terminal font must be a Nerd Font.
%hidden TN_BG="#16161e"
%hidden TN_BLOCK="#3b4261"
%hidden TN_FG="#a9b1d6"
%hidden TN_ACCENT="#7aa2f7"
%hidden TN_ALERT="#e0af68"

set -g status-style "fg=#{TN_FG},bg=#{TN_BG}"

# Defaults of 10 and 40 truncate a session name and a hostname.
set -g status-left-length 60
set -g status-right-length 60

# Default 15 leaves a %H:%M clock a quarter-minute behind.
set -g status-interval 5

# HACK: never retype the format strings below -- their separators are
# private-use glyphs (U+E0B0, U+E0B2) that a rewrite silently drops, leaving
# a bar that parses and draws with no separators at all. Restore them from
# git; the file must hold three U+E0B0 and four U+E0B2.
# The session block turns yellow while the prefix is held.
set -g status-left "#[fg=#{TN_BG},bg=#{?client_prefix,#{TN_ALERT},#{TN_ACCENT}},bold] #S #[fg=#{?client_prefix,#{TN_ALERT},#{TN_ACCENT}},bg=#{TN_BG},nobold]"
set -g status-right "#[fg=#{TN_BLOCK},bg=#{TN_BG}]#[fg=#{TN_FG},bg=#{TN_BLOCK}] %Y-%m-%d  %H:%M #[fg=#{TN_ACCENT},bg=#{TN_BLOCK}]#[fg=#{TN_BG},bg=#{TN_ACCENT},bold] #h "

# NOTE: emptied -- the glyphs supply the gap, the default " " opens a hole.
setw -g window-status-separator ""
setw -g window-status-style "fg=#{TN_FG},bg=#{TN_BG}"
# s/[*-]// drops the current- and last-window flags, which the colours
# already say, and keeps Z (zoomed), ! (bell) and ~ (silent).
setw -g window-status-format " #I #W#{s/[*-]//:window_flags} "
# NONE clears the default underscore.
setw -g window-status-current-style "NONE,fg=#{TN_ACCENT},bg=#{TN_BLOCK},bold"
setw -g window-status-current-format "#[fg=#{TN_BLOCK},bg=#{TN_BG}]#[default] #I #W#{s/[*-]//:window_flags} #[fg=#{TN_BLOCK},bg=#{TN_BG},nobold]"

set -g mode-style "fg=#{TN_ACCENT},bg=#{TN_BLOCK}"
set -g message-style "fg=#{TN_ACCENT},bg=#{TN_BLOCK}"
set -g message-command-style "fg=#{TN_ACCENT},bg=#{TN_BLOCK}"
set -g pane-border-style "fg=#{TN_BLOCK}"
set -g pane-active-border-style "fg=#{TN_ACCENT}"
